# Manual GUI release: GitHub → Actions → Release → enter tag (e.g. v1.2.0).
# The workflow creates and pushes the tag on the current commit if it does not exist yet.
#
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0); created on this commit if missing"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare release tag
        id: meta
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          TAG="${TAG#refs/tags/}"
          TAG="${TAG#v}"
          TAG="v${TAG#v}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 (optional pre-release suffix, e.g. v1.2.0-beta.1)"
            exit 1
          fi

          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          git fetch --tags --force
          if git rev-parse "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            echo "Using existing tag ${TAG}"
          else
            echo "Creating tag ${TAG} on ${GITHUB_SHA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Alfred Identity ${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release tag ${TAG} (app version ${VERSION})"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            wails_platform: windows/amd64
            artifact: windows-amd64
          - os: windows-latest
            wails_platform: windows/arm64
            artifact: windows-arm64
          - os: ubuntu-latest
            wails_platform: linux/amd64
            artifact: linux-amd64
          - os: ubuntu-latest
            wails_platform: linux/arm64
            artifact: linux-arm64
          - os: macos-latest
            wails_platform: darwin/universal
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build GUI
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          wails build -clean -platform "${{ matrix.wails_platform }}" \
            -ldflags "-X github.com/alfred-identity/app/internal/app.Version=${APP_VERSION}"
      - name: Package artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/alfred-identity-${APP_VERSION}-${ARTIFACT}.zip"
          cd build/bin
          if compgen -G "*.app" > /dev/null; then
            zip -r "../../${OUT}" ./*.app
          elif compgen -G "*.exe" > /dev/null; then
            zip "../../${OUT}" ./*.exe
          else
            zip "../../${OUT}" ./*
          fi
          cd ../..
          ls -lh dist
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = "dist/alfred-identity-$env:APP_VERSION-$env:ARTIFACT.zip"
          if (Test-Path "dist/$out") { Remove-Item "dist/$out" -Force }
          Compress-Archive -Path "build/bin/*" -DestinationPath $out
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: alfred-identity-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: List release assets
        run: find dist -type f -print
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Alfred Identity ${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/**/*.zip
          fail_on_unmatched_files: true
