name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            wails_platform: windows/amd64
          - os: windows-latest
            wails_platform: windows/arm64
          - os: ubuntu-latest
            wails_platform: linux/amd64
          - os: ubuntu-latest
            wails_platform: linux/arm64
          - os: macos-latest
            wails_platform: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        run: |
          wails build -clean -platform ${{ matrix.wails_platform }} -ldflags "-X main.Version=${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: alfred-identity-${{ matrix.wails_platform }}
          path: |
            build/bin/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
